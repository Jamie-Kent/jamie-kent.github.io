<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  
  {% if page.description %}
  <meta name="description" content="{{ page.description }}">
  {% elsif site.description %}
  <meta name="description" content="{{ site.description }}">
  {% endif %}
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
</head>
<body class="bg-gray-50 text-gray-900">
  
  <!-- Navigation -->
  <nav class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-4xl mx-auto px-4 py-4">
      <div class="flex justify-between items-center">
        <a href="{{ '/' | relative_url }}" class="text-xl font-bold text-gray-900">{{ site.title }}</a>
        <div class="space-x-6">
          <a href="{{ '/' | relative_url }}" class="text-gray-600 hover:text-gray-900">Home</a>
          <a href="{{ '/blog' | relative_url }}" class="text-gray-600 hover:text-gray-900">Blog</a>
          <a href="/about.html" class="text-gray-600 hover:text-gray-900">About</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 py-8">
    {{ content }}
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-200 mt-16">
    <div class="max-w-4xl mx-auto px-4 py-8 text-center text-gray-600 text-sm">
      <p>© {{ 'now' | date: "%Y" }} {{ site.title }}</p>
    </div>
  </footer>

</body>
</html>
