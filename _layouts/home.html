---
layout: default
---

<div class="home">
    {% if page.title %}
    <h1>{{ page.title }}</h1>
    {% endif %}

    {{ content }}

    <h2>Recent Posts</h2>
    <ul class="post-list">
        {% for post in site.posts limit:10 %}
        <li>
            <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
            <span class="post-meta">{{ post.date | date: "%B %d, %Y" }}</span>
        </li>
        {% endfor %}
    </ul>
</div>

<style>
.post-list {
    list-style: none;
    padding: 0;
}
.post-list li {
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 1px solid #eee;
}
.post-list .post-meta {
    display: block;
    font-size: 0.8em;
    color: #7f8c8d;
    margin-top: 5px;
}
</style>
